# Fase 13B: proxy inverso de §5.1 ("punto único de entrada: terminación
# TLS 1.3, HTTP/2, compresión, límite de tasa y balanceo hacia los servidores
# de aplicación") y §5.2 (HTTPS y WSS para todo el tráfico).
# Todo entra por https://localhost:${NGINX_HTTPS_PORT}:
#   /api/...       -> backend-1 / backend-2 (sin el prefijo /api)
#   /socket.io/... -> backend-1 / backend-2 con upgrade a WSS
#   /              -> frontend (servidor de Vite, incluido su WebSocket de HMR)

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    # El log incluye qué instancia atendió cada petición ($upstream_addr), para
    # ver el balanceo en `docker compose logs nginx`.
    log_format comanda '$remote_addr "$request" $status -> $upstream_addr ($request_time s)';
    access_log /dev/stdout comanda;

    # DNS interno de Docker. Con `resolve` en los upstream, Nginx vuelve a
    # resolver los nombres cada 5 s: si un backend se detiene, sale del
    # balanceo, y Nginx arranca aunque uno de los dos esté abajo.
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Límite de tasa para los endpoints públicos sin autenticación (menú QR y
    # domicilio web, Fases 7B/8B).
    # DECISIÓN DE PROTOTIPO: 5 peticiones/s por IP con ráfaga de 10. Con
    # Docker Desktop todos los clientes del host llegan con la misma IP, así
    # que en la demo el límite se comporta como uno global.
    limit_req_zone $binary_remote_addr zone=publico:10m rate=5r/s;
    limit_req_status 429;

    # API REST: round robin entre las dos instancias. Si una no responde,
    # Nginx la marca caída 10 s y reintenta en la otra.
    upstream backend_api {
        zone backend_api 64k;
        server backend-1:3000 resolve max_fails=1 fail_timeout=10s;
        server backend-2:3000 resolve max_fails=1 fail_timeout=10s;
    }

    # Socket.IO: el handshake empieza con long-polling (varias peticiones
    # HTTP de la misma sesión) antes de pasar a WebSocket, y todas tienen que
    # llegar a la misma instancia. ip_hash da esa afinidad. Que un evento
    # emitido en una instancia llegue a los sockets de la otra lo resuelve el
    # backplane de Redis (RedisIoAdapter, Fase 4).
    upstream backend_ws {
        zone backend_ws 64k;
        ip_hash;
        server backend-1:3000 resolve max_fails=1 fail_timeout=10s;
        server backend-2:3000 resolve max_fails=1 fail_timeout=10s;
    }

    upstream frontend {
        zone frontend 64k;
        server frontend:5173 resolve;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # DECISIÓN DE PROTOTIPO: certificado autofirmado, generado al arrancar
        # el contenedor (ver generar-certificado.sh). El navegador muestra una
        # advertencia la primera vez.
        # TODO PRODUCCIÓN: certificado de una CA real (p. ej. Let's Encrypt).
        ssl_certificate     /etc/nginx/certs/comanda.crt;
        ssl_certificate_key /etc/nginx/certs/comanda.key;
        ssl_protocols TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;

        gzip on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml;

        proxy_http_version 1.1;
        # Dentro de la red de Docker conectar toma milisegundos. Con el valor
        # por defecto (60 s), una instancia recién detenida (su IP ya no
        # responde) dejaba colgada la petición en vez de pasar a la otra.
        proxy_connect_timeout 2s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade a WebSocket para Socket.IO (WSS) y para el HMR de Vite. Va
        # aquí y no en cada location: un proxy_set_header dentro de una
        # location anula todos los heredados del server (Host incluido).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Resuelve los TODO PRODUCCIÓN de rate limiting de 7B/8B.
        location /api/menu/ {
            limit_req zone=publico burst=10 nodelay;
            proxy_pass http://backend_api/menu/;
        }

        location /api/public/ {
            limit_req zone=publico burst=10 nodelay;
            proxy_pass http://backend_api/public/;
        }

        location /api/ {
            proxy_pass http://backend_api/;
        }

        location /socket.io/ {
            proxy_pass http://backend_ws;
            proxy_read_timeout 1h;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}
