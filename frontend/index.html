<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FBF7EA" />
    <title>Comanda Central</title>
    <!-- Tipografías (skill ui-ux-pro-max, pareja "restaurante"): Karla para la
         interfaz y Playfair Display para los títulos del menú del comensal.
         display=swap: si no cargan (p. ej. sin conexión), se ve la del sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
    />
    <!-- Aplica el tema guardado antes de pintar, para que no parpadee el modo
         claro al abrir en modo oscuro (ver src/tema/tema.ts). -->
    <script>
      try {
        var guardado = localStorage.getItem('comanda:tema');
        var oscuro = guardado ? guardado === 'oscuro' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = oscuro ? 'oscuro' : 'claro';
      } catch (e) {
        document.documentElement.dataset.theme = 'claro';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
