# DECISIÓN DE PROTOTIPO (Fase 13, §5.1): pg_hba.conf del primario, montado y
# activado con `-c hba_file=` en docker-compose.yml. Es el de la imagen oficial
# de postgres (local/loopback en trust, resto con scram-sha-256) más UNA línea
# para que la réplica se conecte por replicación en streaming. Se monta como
# archivo (y no con un script de initdb) para que también valga en volúmenes
# de datos que ya existían antes de la Fase 13.
# TIPO   BASE          USUARIO       DIRECCIÓN        MÉTODO
local    all           all                            trust
host     all           all           127.0.0.1/32     trust
host     all           all           ::1/128          trust
local    replication   all                            trust
host     replication   all           127.0.0.1/32     trust
host     replication   all           ::1/128          trust
# La réplica entra con el usuario de replicación, solo desde la red de Docker.
host     replication   replicador    all              scram-sha-256
host     all           all           all              scram-sha-256
