# Política de reinicio de todos los servicios: "no".
# Docker Desktop no publica bien los puertos de los contenedores que el propio
# Docker arranca al iniciar (por unless-stopped, y también por on-failure tras
# un cierre brusco): quedan "Up" pero localhost:5173, 8443, 8025, 5432...
# no responden desde Windows. Los que arranca `docker compose` sí quedan bien
# (probado el 20/10/2026). Por eso nada arranca solo: al prender el PC o
# reiniciar Docker se levanta con `docker compose up -d --wait`.

# Fase 13B: configuración común de las dos instancias del backend.
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile.dev
  restart: "no"
  env_file:
    - .env
  environment:
    PORT: ${BACKEND_PORT}
    # Redis se sigue chequeando en /health por TCP crudo (ver TODO PRODUCCION
    # en health.controller.ts); Postgres ya se resuelve vía DATABASE_URL/Prisma.
    REDIS_HOST: redis
    REDIS_PORT_INTERNAL: 6379
  networks:
    default:
      aliases:
        - backend
  volumes:
    - ./backend:/app
    - comanda-backend-node-modules:/app/node_modules
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    postgres-replica:
      condition: service_healthy
    prisma-generate:
      condition: service_completed_successfully
  # "healthy" solo cuando la API responde de verdad (/health revisa Postgres y
  # Redis). Antes, "Up" no garantizaba nada: el backend tarda en compilar y
  # migrar, y un login en ese momento fallaba. Con `docker compose up -d
  # --wait` el comando no termina hasta que todo esté healthy.
  healthcheck:
    test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 240s

services:
  postgres:
    image: postgres:16-alpine
    container_name: comanda-postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Fase 13 (§5.1): el primario acepta réplicas en streaming.
    # DECISIÓN DE PROTOTIPO: wal_level=replica ya es el default de PG16, se
    # fija explícito para que sea visible; wal_keep_size retiene WAL suficiente
    # para que la réplica se ponga al día tras un reinicio sin usar slots.
    # pg_hba.conf va montado (ver postgres/pg_hba.conf).
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - wal_keep_size=256MB
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - comanda-postgres-data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Genera el cliente de Prisma (backend/src/generated/) y termina. Ese código
  # generado no va en git y vive en el bind mount ./backend, que tapa el que
  # trae la imagen: en un clon nuevo (o tras borrar la carpeta) backend y
  # worker arrancaban sin él (ver docs/EVIDENCIA_EXPOSICION.md, sección 1).
  # DECISIÓN DE PROTOTIPO: un servicio de un solo uso, igual que
  # postgres-replica-setup, en vez de generar en cada contenedor: backend-1,
  # backend-2 y worker comparten la carpeta y escribirían en ella a la vez.
  prisma-generate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: comanda-prisma-generate
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - comanda-backend-node-modules:/app/node_modules
    command: npx prisma generate

  # Fase 13: crea (o actualiza) el rol de replicación en el primario y termina.
  # DECISIÓN DE PROTOTIPO: servicio de un solo uso en vez de un script de
  # initdb, porque estos solo corren con el volumen vacío y el de la base ya
  # existe; así la contraseña sale de .env y también funciona en bases viejas.
  postgres-replica-setup:
    image: postgres:16-alpine
    container_name: comanda-postgres-replica-setup
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      REPL_USER: ${POSTGRES_REPLICATION_USER}
      REPL_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    entrypoint:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -v u="$$REPL_USER" -v p="$$REPL_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE %I WITH LOGIN REPLICATION PASSWORD %L', :'u', :'p')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'u')
        \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN REPLICATION PASSWORD %L', :'u', :'p') \gexec
        SQL
    depends_on:
      postgres:
        condition: service_healthy

  # Fase 13 (§5.1): réplica de lectura en streaming replication desde postgres,
  # para que los reportes no compitan con las escrituras del servicio. Copia
  # física: hereda tablas, roles y políticas RLS del primario. Solo lectura.
  postgres-replica:
    image: postgres:16-alpine
    container_name: comanda-postgres-replica
    restart: "no"
    environment:
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    entrypoint: ["/replica-entrypoint.sh"]
    ports:
      - "${POSTGRES_REPLICA_PORT}:5432"
    volumes:
      - comanda-postgres-replica-data:/var/lib/postgresql/data
      - ./postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: comanda-redis
    restart: "no"
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fase 13B: dos instancias del backend detrás de Nginx (§5.1, "dos
  # instancias ... para tolerancia a fallos"). Comparten configuración por el
  # ancla x-backend. Las dos responden también al alias de red `backend`, así
  # que los servicios internos (worker -> webhook del simulador, proxy de Vite)
  # siguen usando http://backend:3000 y Docker reparte entre las que estén vivas.
  backend-1:
    <<: *backend
    container_name: comanda-backend-1
    ports:
      # DECISIÓN DE PROTOTIPO: backend-1 sigue publicado directo en el host
      # para Swagger (/api/docs) y depuración; la app entra por Nginx.
      - "${BACKEND_PORT}:3000"
      # Puerto de Prisma Studio (GUI para ver/editar la base de datos). Solo
      # se usa cuando alguien lo levanta a mano (ver README); no se inicia
      # solo. `prisma studio` solo escucha en 127.0.0.1 dentro del
      # contenedor, así que se expone vía un pequeño proxy TCP en Node (ver
      # README) en vez del puerto de Studio directo.
      - "5556:5556"
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/configurar-rol-app.ts && npm run start:dev"

  backend-2:
    <<: *backend
    container_name: comanda-backend-2
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/configurar-rol-app.ts && npm run start:dev:2"

  # Fase 11B: almacén de objetos de §5.1 (XML fiscales). Consola web en
  # http://localhost:${MINIO_CONSOLE_PORT} con MINIO_ROOT_USER/PASSWORD.
  # DECISIÓN DE PROTOTIPO: MinIO dejó de publicar imágenes en Docker Hub
  # (minio/minio ya no descarga); se usa la imagen congelada de Bitnami, que
  # es el mismo servidor MinIO (versión 2025.5.24) sin actualizaciones.
  # Basta para un prototipo local; en producción sería un S3 administrado.
  minio:
    image: bitnamilegacy/minio:2025.5.24
    container_name: comanda-minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - comanda-minio-data:/bitnami/minio/data

  # Fase 11B: trabajador asíncrono de §5.1. Misma imagen y código que el
  # backend, otro punto de entrada (src/worker.ts): consume la cola fiscal de
  # BullMQ y valida los documentos contra el proveedor DIAN simulado.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: comanda-worker
    restart: "no"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT_INTERNAL: 6379
    volumes:
      - ./backend:/app
      - comanda-backend-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
      prisma-generate:
        condition: service_completed_successfully
    # migrate deploy también aquí por si el worker arranca antes que el
    # backend; Prisma serializa los dos con un advisory lock.
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/configurar-rol-app.ts && npm run start:worker"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: comanda-frontend
    restart: "no"
    env_file:
      - .env
    environment:
      PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - comanda-frontend-node-modules:/app/node_modules
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Fase 13B: proxy inverso con TLS 1.3, HTTP/2, WSS, límite de tasa y
  # balanceo entre backend-1 y backend-2. Entrada única de la app:
  # https://localhost:${NGINX_HTTPS_PORT}. Ver nginx/nginx.conf.
  nginx:
    build:
      context: ./nginx
    container_name: comanda-nginx
    restart: "no"
    environment:
      NGINX_CERT_IP: ${NGINX_CERT_IP:-}
    ports:
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - comanda-nginx-certs:/etc/nginx/certs
    depends_on:
      frontend:
        condition: service_healthy
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -skf -o /dev/null https://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Fase 14B: servidor SMTP local de §5.2 con bandeja web para la demo
  # (http://localhost:${MAILPIT_WEB_PORT}). Recibe todos los correos del
  # worker y no entrega ninguno de verdad. El SMTP (1025) solo se usa dentro
  # de la red de Docker, por eso no se publica.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: comanda-mailpit
    restart: "no"
    ports:
      - "${MAILPIT_WEB_PORT}:8025"

volumes:
  comanda-postgres-data:
  comanda-postgres-replica-data:
  comanda-minio-data:
  comanda-backend-node-modules:
  comanda-frontend-node-modules:
  comanda-nginx-certs:
